# YTClip Production Nginx Reverse Proxy & Frontend Configuration
# Place at /etc/nginx/sites-available/ytclip.conf and symlink into /etc/nginx/sites-enabled/
# Replace YOUR-DOMAIN.com with your real domain, then run:
#   sudo certbot --nginx -d YOUR-DOMAIN.com -d www.YOUR-DOMAIN.com -d api.YOUR-DOMAIN.com

server {
    listen 80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    root /opt/ytclip/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    server_name api.YOUR-DOMAIN.com;

    # Allow large video uploads (up to 2 GB)
    client_max_body_size 2048M;

    # Stream uploads directly to Node.js disk storage without buffering whole body in Nginx
    proxy_request_buffering off;
    proxy_buffering off;

    # Extended timeouts for FFmpeg clip rendering & probing requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
